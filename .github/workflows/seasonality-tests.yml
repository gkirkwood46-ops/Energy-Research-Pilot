name: Seasonality calculations
on:
  push:
    branches: [tester-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run seasonality regression tests
        run: node tests/seasonality-engine.test.js
